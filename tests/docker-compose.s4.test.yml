# S4: Docker 动态 provision 测试
# Controller 通过 docker.sock 动态创建 worker 容器
# Worker 由 DockerProvisioner 管理，非固定实例
#
# 设计说明：
# - 自定义镜像中已烘焙 teamclaw 插件到 /app/extensions/teamclaw
# - 构建时 patch 了 buildDockerBinds()，当 TEAMCLAW_BAKED_IN=true
#   时不添加自动 bind mount（避免容器内路径无法被 Docker daemon 解析）
# - worker 容器使用同一个镜像，自带完整的 teamclaw 文件
#
# 需要的环境变量：
#   ZAI_API_KEY       - LLM API 密钥
#   OPENCLAW_IMAGE   - 自定义镜像名（默认 registry.iot2.win/openclaw:teamclaw-test）
#   CONTROLLER_PORT  - Controller 端口（默认 9527）
#   OPENCLAW_PLATFORM - Docker 平台（默认 linux/amd64）
services:
  tc-s4-controller:
    image: ${OPENCLAW_IMAGE:-registry.iot2.win/openclaw:teamclaw-test}
    platform: ${OPENCLAW_PLATFORM:-linux/amd64}
    container_name: tc-s4-controller
    group_add:
      - "0"
    env_file:
      - ${TEST_ENV_FILE:-.env}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: Asia/Shanghai
      TEAMCLAW_BAKED_IN: "true"
    volumes:
      - ${TEAMCLAW_CONTROLLER_CONFIG_DIR:?TEAMCLAW_CONTROLLER_CONFIG_DIR is required}:/home/node/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${CONTROLLER_PORT:-9527}:9527"
    networks:
      - teamclaw-s4-net
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--allow-unconfigured",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9527/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true

networks:
  teamclaw-s4-net:
    driver: bridge
    name: teamclaw-s4-net
