# S5: Single Pod (controller + localRoles)
apiVersion: v1
kind: Pod
metadata:
  name: teamclaw
  namespace: teamclaw
  labels:
    app: teamclaw
    scenario: s5
spec:
  initContainers:
    - name: copy-config
      image: registry.iot2.win/openclaw:teamclaw-test
      command: ["sh", "-c", "cp /config-ro/openclaw.json /config/openclaw.json && mkdir -p /config/plugins /config/workspace/memory /config/logs"]
      volumeMounts:
        - name: config-ro
          mountPath: /config-ro
        - name: config
          mountPath: /config
  containers:
    - name: teamclaw
      image: registry.iot2.win/openclaw:teamclaw-test
      ports:
        - containerPort: 9527
          protocol: TCP
      env:
        - name: HOME
          value: /home/node
        - name: ZAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: teamclaw-secrets
              key: zai-api-key
      volumeMounts:
        - name: config
          mountPath: /home/node/.openclaw
      livenessProbe:
        httpGet:
          path: /api/v1/health
          port: 9527
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /api/v1/health
          port: 9527
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
  volumes:
    - name: config-ro
      configMap:
        name: teamclaw-single-config
    - name: config
      emptyDir: {}
  restartPolicy: Never
---
# S6: Controller Pod (dynamic k8s provision)
apiVersion: v1
kind: Pod
metadata:
  name: teamclaw-controller
  namespace: teamclaw
  labels:
    app: teamclaw
    scenario: s6
spec:
  serviceAccountName: teamclaw-controller
  initContainers:
    - name: copy-config
      image: registry.iot2.win/openclaw:teamclaw-test
      command: ["sh", "-c", "cp /config-ro/openclaw.json /config/openclaw.json && mkdir -p /config/plugins /config/workspace/memory /config/logs"]
      volumeMounts:
        - name: config-ro
          mountPath: /config-ro
        - name: config
          mountPath: /config
    - name: install-kubectl
      image: bitnami/kubectl:latest
      command: ["sh", "-c", "cp /opt/bitnami/kubectl/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl"]
      volumeMounts:
        - name: kubectl-bin
          mountPath: /kubectl-bin
  containers:
    - name: teamclaw
      image: registry.iot2.win/openclaw:teamclaw-test
      ports:
        - containerPort: 9527
          protocol: TCP
      env:
        - name: HOME
          value: /home/node
        - name: PATH
          value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/kubectl-bin"
        - name: ZAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: teamclaw-secrets
              key: zai-api-key
      volumeMounts:
        - name: config
          mountPath: /home/node/.openclaw
        - name: kubectl-bin
          mountPath: /kubectl-bin
        - name: docker-sock
          mountPath: /var/run/docker.sock
          readOnly: true
      livenessProbe:
        httpGet:
          path: /api/v1/health
          port: 9527
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /api/v1/health
          port: 9527
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
  volumes:
    - name: config-ro
      configMap:
        name: teamclaw-dynamic-config
    - name: config
      emptyDir: {}
    - name: kubectl-bin
      emptyDir: {}
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
        type: Socket
  restartPolicy: Never
