apiVersion: v1
kind: ServiceAccount
metadata:
  name: teamclaw-controller
  namespace: teamclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teamclaw-worker-manager
  namespace: teamclaw
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teamclaw-worker-manager-binding
  namespace: teamclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teamclaw-worker-manager
subjects:
  - kind: ServiceAccount
    name: teamclaw-controller
    namespace: teamclaw
