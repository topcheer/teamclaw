apiVersion: v1
kind: Namespace
metadata:
  name: teamclaw
---
# Controller config for S5 (single pod, localRoles)
apiVersion: v1
kind: ConfigMap
metadata:
  name: teamclaw-single-config
  namespace: teamclaw
data:
  openclaw.json: |
    {
      "agents": {
        "defaults": {
          "model": { "primary": "zai/glm-5-turbo" }
        }
      },
      "commands": { "native": "auto", "nativeSkills": "auto", "restart": true, "ownerDisplay": "raw" },
      "gateway": {
        "auth": { "mode": "token", "token": "47989963b032656bbfe24aee1f459531402cbd90a34fc83d" }
      },
      "plugins": {
        "enabled": true,
        "entries": {
          "teamclaw": {
            "enabled": true,
            "config": {
              "mode": "controller",
              "port": 9527,
              "teamName": "calc-project",
              "gitEnabled": false,
              "heartbeatIntervalMs": 5000,
              "taskTimeoutMs": 300000,
              "localRoles": ["developer", "qa", "architect"]
            }
          }
        }
      }
    }
---
# Controller config for S6 (dynamic k8s provision)
apiVersion: v1
kind: ConfigMap
metadata:
  name: teamclaw-dynamic-config
  namespace: teamclaw
data:
  openclaw.json: |
    {
      "agents": {
        "defaults": {
          "model": { "primary": "zai/glm-5-turbo" }
        }
      },
      "commands": { "native": "auto", "nativeSkills": "auto", "restart": true, "ownerDisplay": "raw" },
      "gateway": {
        "auth": { "mode": "token", "token": "47989963b032656bbfe24aee1f459531402cbd90a34fc83d" }
      },
      "plugins": {
        "enabled": true,
        "entries": {
          "teamclaw": {
            "enabled": true,
            "config": {
              "mode": "controller",
              "port": 9527,
              "teamName": "calc-project",
              "gitEnabled": true,
              "heartbeatIntervalMs": 10000,
              "taskTimeoutMs": 1800000,
              "workerProvisioningType": "kubernetes",
              "workerProvisioningKubernetesNamespace": "teamclaw",
              "workerProvisioningRoles": ["developer", "qa", "architect"],
              "workerProvisioningMinPerRole": 1,
              "workerProvisioningMaxPerRole": 1,
              "workerProvisioningIdleTtlMs": 300000,
              "workerProvisioningStartupTimeoutMs": 120000,
              "workerProvisioningImage": "registry.iot2.win/openclaw:teamclaw-test",
              "workerProvisioningControllerUrl": "http://teamclaw-controller.teamclaw.svc.cluster.local:9527",
              "workerProvisioningPassEnv": ["ZAI_API_KEY"]
            }
          }
        }
      }
    }
