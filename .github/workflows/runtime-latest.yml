name: Runtime tar (runtime-latest)

# Rolling fixed-URL artifact: the release tag `runtime-latest` never moves;
# every push to main (and manual dispatch) rebuilds and REPLACES the tar
# assets on that release. Desktop "artifact" installs pin this URL:
#   https://github.com/topcheer/teamclaw/releases/download/runtime-latest/teamclaw-runtime-<plat>.tar.gz
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-latest
  cancel-in-progress: true

jobs:
  build-tars:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - { os: macos-latest, plat: darwin-arm64 }
          # build-runtime-tar.mjs derives the tar name from process.arch, so
          # darwin-x64 genuinely needs an Intel runner (macos-13 is retired).
          - { os: macos-15-intel, plat: darwin-x64 }
          - { os: ubuntu-latest, plat: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Build runtime tar
        run: node scripts/build-runtime-tar.mjs dist-runtime
      - name: Replace asset on runtime-latest release
        run: |
          set -euo pipefail
          # Create the rolling release once; then swap OUR platform's assets
          # (delete-asset per file, same pattern as desktop-release.yml). The
          # old whole-release delete raced the 3-way concurrent matrix - each
          # job recreated the release with only its own platform, leaving the
          # live release darwin-arm64-only while desktop/main.mjs hardcodes
          # these URLs for all platforms (#225 E1).
          gh release view runtime-latest >/dev/null 2>&1 || gh release create runtime-latest --title "Runtime bundle (rolling)" --notes "Auto-replaced on every main push. Fixed URL by design." --prerelease
          for f in dist-runtime/teamclaw-runtime-${{ matrix.plat }}.tar.gz*; do
            # delete-asset takes the ASSET name, not a path - strip the
            # dist-runtime/ prefix (desktop-release.yml avoids this by cd'ing
            # into dist first; without basename the delete silently no-ops and
            # the upload then fails on "asset already exists").
            gh release delete-asset runtime-latest "$(basename "$f")" --yes 2>/dev/null || true
          done
          gh release upload runtime-latest dist-runtime/teamclaw-runtime-${{ matrix.plat }}.tar.gz*
        env:
          GH_TOKEN: ${{ github.token }}
