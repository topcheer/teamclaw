name: TeamClaw Operator Image

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - ".github/workflows/teamclaw-operator-image.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: teamclaw-operator-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_operator_image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/teamclaw-operator"
          # shellcheck disable=SC2086
          IMAGE="$(echo $IMAGE | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest,${IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: operator/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=teamclaw-operator
          cache-to: type=gha,scope=teamclaw-operator,mode=max
