name: TeamClaw Plugin NPM Release

# Before the first publish, configure npm trusted publishing for:
# - GitHub repo: topcheer/teamclaw
# - Workflow file: .github/workflows/teamclaw-plugin-npm-release.yml

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/teamclaw-plugin-npm-release.yml"
      - "src/**"
      - "scripts/teamclaw-package-check.mjs"
      - "scripts/teamclaw-npm-publish.sh"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA on main to publish from
        required: true
        type: string

concurrency:
  group: teamclaw-plugin-npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"

jobs:
  preview_package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ref_sha: ${{ steps.ref.outputs.sha }}
      package_dir: ${{ steps.metadata.outputs.package_dir }}
      package_name: ${{ steps.metadata.outputs.package_name }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      publish_tag: ${{ steps.metadata.outputs.publish_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve checked-out ref
        id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate ref is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Validate TeamClaw package metadata
        id: metadata
        run: node scripts/teamclaw-package-check.mjs src --github-output "$GITHUB_OUTPUT"

      - name: Preview publish command
        run: bash scripts/teamclaw-npm-publish.sh --dry-run src

      - name: Preview npm pack contents
        working-directory: src
        run: npm pack --dry-run --json --ignore-scripts

  # Test gate for npm publishes (issue #20). PR #217's description claimed
  # this job but its merge (c0b82d7) never included the workflow file, so the
  # gate never existed at HEAD; restored here per issue #255 P0-2. Runs the
  # full tests/test-*.mjs suite against the exact ref preview_package
  # resolved (workflow_dispatch can name any main SHA), and publish_package
  # below cannot start until it is green.
  test_suite:
    needs: preview_package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preview_package.outputs.ref_sha }}
          fetch-depth: 1

      # Pinned minor: locked openclaw@2026.10.9 requires node >=24.22.1
      # (preinstall-enforced); floating "24" is not deterministic (a0caf6e).
      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: src/package-lock.json

      # Registry flake resilience without third-party actions.
      - name: Install dependencies (retry once on registry flake)
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if npm --prefix src ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci attempt ${attempt}/2 failed; retrying after backoff..."
            sleep $(( attempt * 15 ))
          done
          echo "::error::npm ci failed after 2 attempts"
          exit 1

      - name: Build
        run: npm --prefix src run build

      - name: Run full unit suite (tests/test-*.mjs)
        run: |
          set -uo pipefail
          total=0
          failed=0
          for t in tests/test-*.mjs; do
            total=$(( total + 1 ))
            echo "::group::${t}"
            if node "$t"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error file=${t}::${t} exited ${status}"
              failed=$(( failed + 1 ))
            fi
          done
          echo "unit suites: ${total} run, ${failed} failed"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  publish_package:
    needs: [preview_package, test_suite]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preview_package.outputs.ref_sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Validate TeamClaw package metadata
        run: node scripts/teamclaw-package-check.mjs src

      - name: Ensure version is not already published
        env:
          PACKAGE_NAME: ${{ needs.preview_package.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.preview_package.outputs.package_version }}
        run: |
          set -euo pipefail
          if npm view --registry https://registry.npmjs.org/ "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              # Push-triggered runs fire on every src/** commit; a version that
              # is already on npm means "nothing to publish", not a failure.
              # Only an explicit workflow_dispatch release must go red here.
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm; push-triggered run skips publishing cleanly."
              echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on npm."
            exit 1
          fi

      - name: Publish package
        if: env.SKIP_PUBLISH != 'true'
        env:
          TEAMCLAW_NPM_PROVENANCE: always
        run: bash scripts/teamclaw-npm-publish.sh --publish src
