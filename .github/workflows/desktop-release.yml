name: Desktop bundles (desktop-latest)

# Rolling fixed-URL desktop installers, same design as runtime-latest:
# the release tag `desktop-latest` never moves; every push to main (and
# manual dispatch) rebuilds and REPLACES the per-platform installer assets.
# Stable URLs:
#   https://github.com/topcheer/teamclaw/releases/download/desktop-latest/TeamClaw-Desktop-<version>-<plat>.<ext>
#
# Platform natives are staged per-target via scripts/prepare-bundle.mjs
# (TC_OS/TC_CPU + --ignore-scripts), then electron-builder packages each
# platform. Installers are unsigned (SmartScreen/Gatekeeper show a prompt).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-latest
  cancel-in-progress: true

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others (fail-fast cancelled
      # win+arm64 when the x64 CSC_NAME tripped - run 42139296590).
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, plat: darwin-arm64, tc_os: darwin, tc_cpu: arm64, args: "--mac dmg zip --arm64" }
          - { os: macos-latest, plat: darwin-x64, tc_os: darwin, tc_cpu: x64, args: "--mac dmg zip --x64" }
          - { os: windows-latest, plat: win32-x64, tc_os: win32, tc_cpu: x64, args: "--win nsis --x64" }
          - { os: ubuntu-latest, plat: linux-x64, tc_os: linux, tc_cpu: x64, args: "--linux AppImage deb --x64" }
    env:
      TC_OS: ${{ matrix.tc_os }}
      TC_CPU: ${{ matrix.tc_cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install desktop toolchain
        run: npm ci
        working-directory: desktop
      # macOS signing + notarization. Recipe copied VERBATIM from ggcode's
      # PROVEN DMG path (scripts/release/build-desktop-darwin.sh, ships
      # production): a DEDICATED temp keychain with its own password, import
      # with -A (no per-app access prompts), partition-list keyed by THAT
      # keychain's password, keychain pinned via CSC_KEYCHAIN for
      # electron-builder's internal codesign. The login-keychain variant
      # (ggcode's MAS lane) hangs headless runners: its password is not
      # empty on GitHub images, so partition-list silently fails and codesign
      # blocks on a GUI authorization prompt (three dead runs).
      - name: Import Apple signing credentials (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -z "${APPLE_DEVELOPER_ID_P12}" || -z "${APPLE_API_KEY_P8}" ]]; then
            echo "No Apple signing credentials - building unsigned"
            echo "MAC_UNSIGNED=1" >> "${GITHUB_ENV}"
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-$(date +%s)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          printf '%s' "${APPLE_DEVELOPER_ID_P12}" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -P "${APPLE_DEVELOPER_ID_P12_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" 2>/dev/null || true
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db 2>/dev/null || true
          # Fail loud if the identity does not resolve in THIS keychain.
          security find-identity -v -p codesigning "${KEYCHAIN}" | grep -q "Developer ID Application" || {
            echo "::error::Developer ID identity not resolvable in signing keychain"; exit 1; }
          # The secret may be the raw p8 (single/multiline) or its base64 -
          # accept both so a wrongly-encoded secret cannot silently produce
          # a garbage key file (notarize would fail at submit with it).
          if printf '%s' "${APPLE_API_KEY_P8}" | head -c 32 | grep -q "BEGIN"; then
            printf '%s\n' "${APPLE_API_KEY_P8}" > "${RUNNER_TEMP}/AuthKey.p8"
          else
            printf '%s' "${APPLE_API_KEY_P8}" | base64 -d > "${RUNNER_TEMP}/AuthKey.p8"
          fi
          grep -q "BEGIN PRIVATE KEY" "${RUNNER_TEMP}/AuthKey.p8" || { echo "::error::AuthKey.p8 malformed"; exit 1; }
          {
            echo "CSC_NAME=Junjun Zhang (EGZFS7M525)"
            echo "CSC_KEYCHAIN=${KEYCHAIN}"
            echo "APPLE_API_KEY=${RUNNER_TEMP}/AuthKey.p8"
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}"
            echo "APPLE_API_ISSUER_ID=${APPLE_API_ISSUER_ID}"
          } >> "${GITHUB_ENV}"
          echo "signing keychain ready: ${KEYCHAIN}"
      - name: Stage target runtime (platform natives)
        run: node scripts/prepare-bundle.mjs
        working-directory: desktop
      - name: Package
        shell: bash
        # macOS runners default to soft 256 fds; signing the ~380-package
        # embedded runtime exhausts handles (EMFILE twice: runs 42139804651,
        # 42140592255 - ulimit alone did not clear the hard limit). Raise the
        # SYSTEM ceiling first, then the shell limit, and echo diagnostics.
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            sudo sysctl -w kern.maxfiles=65536 kern.maxfilesperproc=65536 || true
          fi
          ulimit -n 65536 2>/dev/null || ulimit -n hard 2>/dev/null || true
          echo "fd limits: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          for v in CSC_NAME CSC_KEYCHAIN APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            eval "val=\${$v:-}"
            echo "env[$v]=${val:+SET}${val:-EMPTY}"
          done
          npx electron-builder ${{ matrix.args }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'true' || 'false' }}
      - name: Normalize asset names
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/dist
          V=$(node -p "require('../package.json').version")
          PLAT=${{ matrix.plat }}
          # electron-builder emits per-job single-arch artifacts ("TeamClaw
          # Desktop-0.1.0-arm64.dmg", "TeamClaw Desktop Setup 0.1.0.exe",
          # "teamclaw-desktop_0.1.0_amd64.deb", ...). Map each extension to
          # one dash-joined, URL-safe, platform-tagged name.
          for f in *.dmg *.zip *.exe *.AppImage *.deb; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            case "$ext" in
              dmg) dst="TeamClaw-Desktop-${V}-${PLAT}.dmg" ;;
              zip) dst="TeamClaw-Desktop-${V}-${PLAT}-mac.zip" ;;
              exe) dst="TeamClaw-Desktop-${V}-${PLAT}-Setup.exe" ;;
              AppImage) dst="TeamClaw-Desktop-${V}-${PLAT}.AppImage" ;;
              deb) dst="TeamClaw-Desktop-${V}-${PLAT}.deb" ;;
            esac
            mv "$f" "$dst"
          done
          ls -lh TeamClaw-Desktop-*
      - name: Replace assets on desktop-latest release
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/dist
          # Create the rolling release once; then swap OUR platform's assets
          # (delete-asset per file avoids clobbering other matrix jobs).
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "Desktop bundles (rolling)" --notes "Auto-replaced on every main push. Fixed URL by design. Unsigned installers." --prerelease
          for f in TeamClaw-Desktop-*; do
            gh release delete-asset desktop-latest "$f" --yes 2>/dev/null || true
          done
          gh release upload desktop-latest TeamClaw-Desktop-*
        env:
          GH_TOKEN: ${{ github.token }}
