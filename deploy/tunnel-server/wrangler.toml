name = "teamclaw-tunnel-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "apps.teamclaw.dev/api/*", zone_name = "teamclaw.dev" }
]

[vars]
# Issue #231 grey window CLOSED 2026-11-10: a 180s `wrangler tail` window
# observed zero "legacy controller" warns (the only traffic was our own
# /api/health probes), so ACCEPT_LEGACY_CREATE flipped to "false".
# POST /api/tunnels now requires Authorization: Bearer <github token>
# proving github_user ownership — headerless creates get 401.
ACCEPT_LEGACY_CREATE = "false"
