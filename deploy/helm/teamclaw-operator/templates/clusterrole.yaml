apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teamclaw-operator
  labels:
    app.kubernetes.io/name: teamclaw-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["teamclaw.dev"]
    resources: ["teamclaws"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["teamclaw.dev"]
    resources: ["teamclaws/status", "teamclaws/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # secrets get/list/watch feed the manager cache; create/update/patch serve
  # the UI inline-config path (<team>-config secrets)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # manager cache watches these cluster-scoped; the per-team grant below
  # cannot substitute for the watch verbs
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
