apiVersion: v1
kind: Service
metadata:
  name: teamclaw-operator-ui
  labels:
    app.kubernetes.io/name: teamclaw-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.ui.type }}
  selector:
    app.kubernetes.io/name: teamclaw-operator
  ports:
    - name: ui
      port: {{ .Values.ui.port }}
      targetPort: ui
      {{- if and (eq .Values.ui.type "NodePort") .Values.ui.nodePort }}
      nodePort: {{ .Values.ui.nodePort }}
      {{- end }}
