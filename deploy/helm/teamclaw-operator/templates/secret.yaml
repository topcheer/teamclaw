{{- if not .Values.token.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: teamclaw-operator-ui-token
  labels:
    app.kubernetes.io/name: teamclaw-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  token: {{ required "token.token required when token.existingSecret is empty" .Values.token.token }}
{{- end }}
