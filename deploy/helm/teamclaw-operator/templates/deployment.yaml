apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamclaw-operator
  labels:
    app.kubernetes.io/name: teamclaw-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: teamclaw-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teamclaw-operator
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --leader-elect={{ .Values.leaderElection.enabled }}
          env:
            - name: TEAMCLAW_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.token.existingSecret }}
            - name: TEAMCLAW_OPERATOR_UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.token.existingSecret }}
                  key: {{ .Values.token.key }}
            {{- else }}
            - name: TEAMCLAW_OPERATOR_UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: teamclaw-operator-ui-token
                  key: token
            {{- end }}
          ports:
            - name: ui
              containerPort: {{ .Values.ui.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: ui
          livenessProbe:
            httpGet:
              path: /healthz
              port: ui
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
