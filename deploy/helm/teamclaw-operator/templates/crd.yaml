apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teamclaws.teamclaw.dev
  labels:
    app.kubernetes.io/name: teamclaw-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Let helm skip pruning on upgrade diff noise; content is owned here.
    helm.sh/hook: crd-install
spec:
  group: teamclaw.dev
  names:
    plural: teamclaws
    singular: teamclaw
    kind: TeamClaw
    shortNames: [tc]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Team
          type: string
          jsonPath: .spec.teamName
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Workers
          type: string
          jsonPath: .status.workerPods.running
        - name: Endpoint
          type: string
          jsonPath: .status.controllerEndpoint
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [teamName, image]
              properties:
                teamName:
                  type: string
                image:
                  type: string
                  default: ghcr.io/topcheer/teamclaw-openclaw:latest
                controller:
                  type: object
                  properties:
                    modelConfigSecretRef:
                      type: string
                    scheduling:
                      type: object
                      properties:
                        nodeSelector:
                          type: object
                          additionalProperties:
                            type: string
                        affinity:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        tolerations:
                          type: array
                          x-kubernetes-preserve-unknown-fields: true
                workspace:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    size:
                      type: string
                      default: 20Gi
                    storageClassName:
                      type: string
                    existingClaim:
                      type: string
                network:
                  type: object
                  properties:
                    servicePort:
                      type: integer
                    serviceType:
                      type: string
                      enum: [ClusterIP, NodePort, LoadBalancer]
                    nodePort:
                      type: integer
                    serviceAnnotations:
                      type: object
                      additionalProperties:
                        type: string
                    ingress:
                      type: object
                      required: [host]
                      properties:
                        host:
                          type: string
                        ingressClassName:
                          type: string
                        tlsSecretName:
                          type: string
                        annotations:
                          type: object
                          additionalProperties:
                            type: string
            status:
              type: object
              properties:
                controllerEndpoint:
                  type: string
                workerPods:
                  type: object
                  properties:
                    running:
                      type: integer
                    pending:
                      type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
