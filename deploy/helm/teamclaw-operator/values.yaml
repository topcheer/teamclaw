# Default values for teamclaw-operator.

image:
  repository: ghcr.io/topcheer/teamclaw-operator
  # Empty default falls back to the chart appVersion (see Chart.yaml), which is
  # a released v-tag published by teamclaw-operator-image.yml (#225 C2/W3) -
  # NOT the mutable :latest channel that CI re-pushes on every main push.
  # For strict reproducibility pin a digest instead, e.g.:
  #   tag: "v2026.11.0@sha256:<digest>"
  tag: ""
  # Immutable version tags: IfNotPresent is enough and makes helm rollback
  # meaningful (image content can no longer change under a fixed tag).
  pullPolicy: IfNotPresent

replicaCount: 1

# Where the operator watches TeamClaw CRs (cluster-scoped watch, teams may
# live in any namespace; default: the release namespace).
# NOTE: the UI/API only *operates* on the release namespace plus
# ui.allowedNamespaces below - watching is broader than writing by design.
namespace: ""

rbac:
  create: true

serviceAccount:
  create: true
  name: teamclaw-operator

# Operator UI (NodePort by default so k3s/on-prem clusters get instant access).
ui:
  enabled: true
  type: NodePort
  port: 9090
  nodePort: 30990
  # Extra namespaces the UI API may operate on beyond the release namespace
  # (the default). Operator RBAC is cluster-scoped; this allowlist bounds a
  # leaked UI token's blast radius. Empty = release namespace only.
  allowedNamespaces: []
  ingress:
    enabled: false
    host: ""
    ingressClassName: ""
    tlsSecretName: ""

# Bearer token guarding the UI + API. Generate with:
#   openssl rand -hex 24
# Either set .token directly or provide .existingSecret
token:
  existingSecret: ""
  key: token
  token: ""

leaderElection:
  enabled: true

# Pod-level hardening (#225 W2). The image runs as distroless nonroot
# (uid/gid 65532); the explicit runAsUser/runAsGroup matter because the image
# USER is non-numeric - runAsNonRoot alone could not be verified by kubelet.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level hardening (#225 W2): no privilege escalation, no capabilities.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Default QoS floor (#225 W1) - requests mirror the kustomize base
# (operator/config/manager/deployment.yaml); set resources: null to omit.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}
