replicaCount: 1

image:
  repository: ghcr.io/topcheer/teamclaw-openclaw
  pullPolicy: IfNotPresent
  # Empty default falls back to the chart appVersion (see Chart.yaml), which is
  # kept in sync with src/package.json releases (#225 C2/W3) - the chart does
  # NOT track the mutable :latest channel that CI re-pushes on every main push.
  # For strict reproducibility pin a digest instead, e.g.:
  #   tag: "2026.11.0@sha256:<digest>"
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

workerServiceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 9527
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: teamclaw.iot2.win
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: teamclaw-iot2-win-tls
      hosts:
        - teamclaw.iot2.win

workspace:
  enabled: true
  existingClaim: ""
  mountPath: /home/node/.openclaw/workspace
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi

config:
  existingSecret: ""
  secretName: ""
  openclaw:
    models:
      providers: {}
    agents:
      defaults:
        model: ""
        timeoutSeconds: 2400
        workspace: /home/node/.openclaw/workspace
    gateway:
      port: 18789
      mode: local
      bind: lan
    plugins:
      enabled: true
      entries:
        teamclaw:
          enabled: true
          config:
            mode: controller
            port: 9527
            teamName: teamclaw
            taskTimeoutMs: 1800000
            heartbeatIntervalMs: 10000
            gitEnabled: true
            gitDefaultBranch: main
            gitAuthorName: TeamClaw
            gitAuthorEmail: teamclaw@local
            workerProvisioningType: none
            workerProvisioningKubernetesNamespace: default
            workerProvisioningKubernetesServiceAccount: ""
            workerProvisioningKubernetesImagePullSecrets: []

controller:
  env: []
  extraVolumes: []
  extraVolumeMounts: []
  command:
    - sh
    - -lc
  args:
    - |
      set -eu
      cp /tmp/config/openclaw.json /home/node/.openclaw/openclaw.json
      mkdir -p /home/node/.openclaw/extensions
      ln -sfn /app/extensions/teamclaw /home/node/.openclaw/extensions/teamclaw
      exec node /app/openclaw.mjs gateway --allow-unconfigured

# Default QoS floor (#225 W1): the controller is a Node.js OpenClaw gateway
# (jiti-compiles the teamclaw extension at startup, then orchestrates agents),
# so the request keeps it out of BestEffort while the limits absorb startup
# and agent-orchestration bursts. Set resources: null to omit entirely.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
