image:
  repository: registry.example.com/teamclaw/teamclaw-openclaw
  # Mirror a released version tag, not the mutable :latest channel (#225 C2).
  tag: "2026.11.0"

imagePullSecrets:
  - name: regcred

config:
  openclaw:
    plugins:
      entries:
        teamclaw:
          config:
            workerProvisioningType: kubernetes
            workerProvisioningPassEnv:
              - ZAI_API_KEY
